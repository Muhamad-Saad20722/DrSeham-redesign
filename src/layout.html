<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description_attr}}" />
    <meta name="theme-color" content="#adebb3" />
    <meta name="author" content="SoftwareSolutions" />
    <meta property="og:title" content="{{title_attr}}" />
    <meta property="og:description" content="{{description_attr}}" />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="{{canonical}}" />
    <link rel="alternate" hreflang="ar" href="{{url_ar}}" />
    <link rel="alternate" hreflang="en" href="{{url_en}}" />
    <link rel="alternate" hreflang="x-default" href="{{url_ar}}" />
    <meta property="og:url" content="{{canonical}}" />
    <meta property="og:locale" content="{{og_locale}}" />
    <meta property="og:site_name" content="{{site_name}}" />
    <meta property="og:image" content="{{site_url}}/assets/img/doctor.webp" />
    <link rel="icon" href="{{root}}assets/img/favicon.png" />
    <link rel="apple-touch-icon" href="{{root}}assets/img/favicon.png" />
    <link rel="stylesheet" href="{{root}}assets/css/{{bootstrap_css}}" />
    <link rel="stylesheet" href="{{root}}assets/css/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="{{root}}assets/css/site.css" />
{{head_extra}}  </head>
  <body>
    <a class="skip-link" href="#main">{{skip}}</a>
    <div class="topbar d-none d-lg-block">
      <div
        class="container d-flex justify-content-between align-items-center py-2"
      >
        <span>
          <i class="bi bi-geo-alt"></i>
          {{address}}
        </span>
        <span class="d-flex gap-4">
          <a href="tel:+201113144573">
            <i class="bi bi-telephone"></i>
            <span class="ltr">01113144573</span>
          </a>
          <a href="https://wa.me/201113144573" target="_blank" rel="noopener">
            <i class="bi bi-whatsapp"></i>
            {{whatsapp}}
          </a>
        </span>
      </div>
    </div>
    <header class="sticky-top">
      <nav class="navbar navbar-expand-lg site-nav" aria-label="{{nav_label}}">
        <div class="container">
          <a class="navbar-brand" href="index.html" aria-label="{{brand_label}}">
            <img
              src="{{root}}assets/img/logo.webp"
              alt="{{logo_alt}}"
              width="78"
              height="52"
            />
          </a>
          <div class="lang-toggle order-lg-3" role="group" aria-label="{{lang_label}}">
{{lang_toggle}}
          </div>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#nav"
            aria-controls="nav"
            aria-expanded="false"
            aria-label="{{menu_open}}"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav mx-lg-auto mb-2 mb-lg-0 gap-lg-1">
{{nav_items}}
            </ul>
            <a class="btn btn-primary" href="appointment.html">
              <i class="bi bi-calendar-check me-1"></i>
              {{book_nav}}
            </a>
          </div>
        </div>
      </nav>
    </header>
    {{main}}
    <footer class="site-footer">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-5">
            <a class="footer-logo mb-3" href="index.html">
              <img
                src="{{root}}assets/img/logo.webp"
                alt="{{footer_logo_alt}}"
                width="81"
                height="54"
                loading="lazy"
              />
            </a>
            <p class="mt-3 pe-lg-5">{{footer_desc}}</p>
            <div class="social d-flex gap-2 mt-3">
              <a href="https://www.facebook.com/profile.php?id=61566491782382" target="_blank" rel="noopener" aria-label="{{social_facebook}}"><i class="bi bi-facebook"></i></a>
              <a href="https://www.instagram.com/dr_seham_chest" target="_blank" rel="noopener" aria-label="{{social_instagram}}"><i class="bi bi-instagram"></i></a>
              <a href="https://www.tiktok.com/@dr.seham.chest" target="_blank" rel="noopener" aria-label="{{social_tiktok}}"><i class="bi bi-tiktok"></i></a>
              <a href="https://www.youtube.com/@drsehammostafasalemchestclinic" target="_blank" rel="noopener" aria-label="{{social_youtube}}"><i class="bi bi-youtube"></i></a>
            </div>
          </div>
          <div class="col-6 col-lg-3">
            <h4>{{quick_links}}</h4>
            <ul>
{{footer_links}}
            </ul>
          </div>
          <div class="col-6 col-lg-4">
            <h4>{{contact_us}}</h4>
            <ul>
              <li>
                <i class="bi bi-telephone me-2 text-amber"></i>
                <a href="tel:+201113144573" class="ltr">+201113144573</a>
              </li>
              <li>
                <i class="bi bi-whatsapp me-2 text-amber"></i>
                <a href="https://wa.me/201113144573" target="_blank" rel="noopener">{{whatsapp}}</a>
              </li>
              <li>
                <i class="bi bi-geo-alt me-2 text-amber"></i>
                <a href="https://maps.app.goo.gl/m8B1rjm5BPKrYKun6" target="_blank" rel="noopener">
                  {{address}}
                </a>
              </li>
            </ul>
          </div>
        </div>
        <div
          class="footer-bottom d-flex flex-column flex-md-row justify-content-between gap-2"
        >
          <span>{{copyright}}</span>
        </div>
      </div>
    </footer>
    <div class="fab-stack">
      <a class="fab map" href="https://maps.app.goo.gl/m8B1rjm5BPKrYKun6" target="_blank" rel="noopener" aria-label="{{fab_map}}">
        <i class="bi bi-geo-alt-fill"></i>
      </a>
      <a class="fab wa" href="https://wa.me/201113144573" target="_blank" rel="noopener" aria-label="{{fab_wa}}">
        <i class="bi bi-whatsapp"></i>
      </a>
    </div>
    <div class="mobile-cta">
      <a class="btn btn-outline-primary" href="tel:+201113144573">
        <i class="bi bi-telephone me-1"></i>
        {{mobile_call}}
      </a>
      <a class="btn btn-primary" href="appointment.html">
        <i class="bi bi-calendar-check me-1"></i>
        {{mobile_book}}
      </a>
    </div>
    <script src="{{root}}assets/js/bootstrap.bundle.min.js"></script>
    <script src="{{root}}assets/js/main.js"></script>
{{scripts}}  </body>
</html>
